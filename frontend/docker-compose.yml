services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notels-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    volumes:
      - .:/app
      - /app/node_modules
