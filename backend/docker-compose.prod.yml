services:
  db:
    image: mysql:8.0
    container_name: notely-db-prod
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - notely-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: notely-backend-prod
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notely-network

volumes:
  mysql_data_prod:

networks:
  notely-network:
    driver: bridge
